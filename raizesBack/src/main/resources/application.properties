spring.application.name=raizesBack
server.port=${PORT:8080}

# Banco: por padrao H2 em memoria (zero configuracao). Para PostgreSQL defina DB_URL/DB_USER/DB_PASSWORD (ver .env.example)
spring.datasource.url=${DB_URL:jdbc:h2:mem:raizesdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:raizes-do-nordeste-chave-secreta-super-longa-trocar-em-producao-2026}
app.jwt.expiration-seconds=${JWT_EXPIRATION:3600}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
